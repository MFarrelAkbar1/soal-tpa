<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan TPA</title>
<style>
  :root{
    --desk:#D6DDE5;
    --paper:#FFFFFF;
    --ink:#132030;
    --ink-soft:#61748A;
    --ink-faint:#93A3B4;
    --rule:#E2E8EF;
    --pen:#27509E;
    --pen-wash:#EEF2FB;
    --margin:#E2564C;
    --benar:#15714E;
    --benar-wash:#EAF6F0;
    --salah:#BE3B32;
    --salah-wash:#FCEEEC;
    --shadow:0 1px 2px rgba(19,32,48,.06), 0 12px 32px -12px rgba(19,32,48,.28);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--desk);
    background-image:radial-gradient(circle at 50% 0%, #E6EBF1 0%, var(--desk) 62%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 64px;
  }

  .wrap{max-width:760px;margin:0 auto}

  /* ---------- kop ---------- */
  .kop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
  .kop-kiri{min-width:0}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 4px
  }
  .judul{font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0}
  .skor-kop{text-align:right;flex-shrink:0}
  .skor-kop .angka{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .skor-kop .ket{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}

  /* ---------- progress ---------- */
  .progress-baris{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .posisi{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
  .chip{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--pen);background:var(--pen-wash);border:1px solid #D6E0F5;
    padding:4px 9px;border-radius:99px
  }
  .rel{height:5px;background:#C6CFDA;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .rel-isi{height:100%;width:0;background:var(--pen);border-radius:99px;transition:width .35s ease}

  /* ---------- lembar soal ---------- */
  .lembar{
    background:var(--paper);
    border-radius:6px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }
  .lembar::before{
    content:"";position:absolute;left:58px;top:0;bottom:0;width:1px;
    background:var(--margin);opacity:.5
  }
  .isi{padding:26px 28px 26px 84px}
  .nomor{
    position:absolute;left:0;width:58px;text-align:center;
    font-family:var(--mono);font-size:15px;font-weight:600;color:var(--margin);
    padding-top:2px
  }
  .soal{font-size:19px;line-height:1.5;font-weight:500;letter-spacing:-.01em;margin:0 0 22px;white-space:pre-line}
  .gambar-soal{
    display:block;width:100%;max-width:100%;height:auto;
    border-radius:4px;border:1px solid var(--rule);
    margin:0 0 22px
  }
  .gambar-soal[hidden]{display:none}

  /* ---------- opsi (gaya bulatan LJK) ---------- */
  .opsi-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .opsi{
    display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
    background:none;border:0;border-radius:5px;padding:10px 12px;margin:0 -12px;
    font:inherit;color:inherit;cursor:pointer;
    transition:background .15s ease
  }
  .opsi:hover:not(:disabled){background:#F4F7FA}
  .opsi:disabled{cursor:default}
  .opsi:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
  .bulat{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    border:1.5px solid #B9C5D2;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-faint);
    transition:background .15s ease,border-color .15s ease,color .15s ease
  }
  .opsi:hover:not(:disabled) .bulat{border-color:var(--pen);color:var(--pen)}
  .teks-opsi{padding-top:2px}

  .opsi.dipilih .bulat{background:var(--ink);border-color:var(--ink);color:#fff}
  .opsi.benar{background:var(--benar-wash)}
  .opsi.benar .bulat{background:var(--benar);border-color:var(--benar);color:#fff}
  .opsi.benar .teks-opsi{color:var(--benar);font-weight:550}
  .opsi.salah{background:var(--salah-wash)}
  .opsi.salah .bulat{background:var(--salah);border-color:var(--salah);color:#fff}
  .opsi.salah .teks-opsi{color:var(--salah);text-decoration:line-through;text-decoration-thickness:1px}

  /* ---------- umpan balik ---------- */
  .kabar{
    border-top:1px solid var(--rule);
    padding:20px 28px 22px 84px;
    background:#FBFCFD
  }
  .kabar[hidden]{display:none}
  .vonis{
    display:flex;align-items:center;gap:9px;
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    margin-bottom:8px
  }
  .vonis .tanda{
    width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;font-family:var(--sans);line-height:1
  }
  .vonis.ok{color:var(--benar)}
  .vonis.ok .tanda{background:var(--benar)}
  .vonis.no{color:var(--salah)}
  .vonis.no .tanda{background:var(--salah)}
  .vonis.abu{color:var(--ink-soft)}
  .vonis.abu .tanda{background:var(--ink-faint)}
  .penjelasan{margin:0;color:#33475C;font-size:15.5px}

  /* ---------- aksi ---------- */
  .aksi{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px}
  .petunjuk{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.04em}
  .tombol{
    font:inherit;font-weight:550;font-size:15px;
    background:var(--pen);color:#fff;border:0;border-radius:5px;
    padding:11px 26px;cursor:pointer;
    transition:background .15s ease,transform .12s ease
  }
  .tombol:hover:not(:disabled){background:#1E3F84}
  .tombol:active:not(:disabled){transform:translateY(1px)}
  .tombol:disabled{background:#C3CCD8;cursor:not-allowed}
  .tombol:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .tombol.hantu{background:none;color:var(--pen);border:1px solid #C6D2E8}
  .tombol.hantu:hover{background:var(--pen-wash)}

  /* ---------- hasil ---------- */
  .hasil{background:var(--paper);border-radius:6px;box-shadow:var(--shadow);padding:34px 30px}
  .hasil-angka{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1;margin:6px 0 2px}
  .hasil-sub{color:var(--ink-soft);font-size:15px;margin:0 0 26px}
  .rincian{border-top:1px solid var(--rule);padding-top:18px;display:flex;flex-direction:column;gap:14px}
  .baris-kat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
  .nama-kat{font-size:14.5px;font-weight:500}
  .nilai-kat{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
  .bar-kat{grid-column:1 / -1;height:4px;background:#EAEFF4;border-radius:99px;overflow:hidden}
  .bar-kat span{display:block;height:100%;background:var(--pen);border-radius:99px}
  .hasil-aksi{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
  .hasil-fakta{
    border-top:1px solid var(--rule);margin-top:22px;padding-top:16px;
    display:flex;flex-direction:column;gap:7px
  }
  .fakta{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .fakta dt{font-size:14.5px;color:var(--ink-soft);margin:0}
  .fakta dd{font-family:var(--mono);font-size:13px;margin:0;text-align:right}
  .fakta dd.tegas{color:var(--salah);font-weight:600}

  /* ---------- layar awal / pilih mode ---------- */
  .menu-blok{margin-bottom:24px}
  .menu-blok:last-child{margin-bottom:0}
  .menu-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 9px
  }
  .kartu-mode{
    display:block;width:100%;text-align:left;font:inherit;color:inherit;
    background:var(--paper);border:1px solid var(--rule);border-radius:6px;
    padding:15px 17px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease
  }
  .kartu-mode + .kartu-mode{margin-top:9px}
  .kartu-mode:hover{border-color:var(--pen);background:var(--pen-wash)}
  .kartu-mode:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
  .kartu-nama{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
  .kartu-ket{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:2px}
  .kartu-meta{
    display:block;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--pen);margin-top:7px
  }

  /* elemen flex tetap harus patuh pada atribut hidden */
  .aksi[hidden],.aksi-ujian[hidden],.navigator[hidden],
  .skor-kop[hidden],.waktu[hidden],.review[hidden]{display:none}

  /* ---------- header lengket + timer (mode ujian) ---------- */
  .kop.lengket{
    position:sticky;top:0;z-index:20;
    background:var(--desk);
    margin:-28px -18px 18px;padding:18px 18px 12px;
    border-bottom:1px solid #C6CFDA
  }
  .waktu{text-align:right;flex-shrink:0}
  .waktu .angka{
    font-family:var(--mono);font-size:22px;font-weight:600;
    letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums
  }
  .waktu .ket{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-faint)
  }
  .waktu.kritis .angka{color:var(--salah)}

  /* ---------- navigator nomor soal ---------- */
  .navigator{
    background:var(--paper);border-radius:6px;box-shadow:var(--shadow);
    padding:16px 18px;margin-top:18px
  }
  .nav-kepala{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px
  }
  .nav-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint)
  }
  .nav-hitung{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
  .nav-nomor{
    font-family:var(--mono);font-size:13px;font-weight:600;
    height:38px;padding:0;border-radius:5px;cursor:pointer;
    border:1.5px solid #B9C5D2;background:none;color:var(--ink-faint);
    transition:background .15s ease,border-color .15s ease,color .15s ease
  }
  .nav-nomor:hover{border-color:var(--pen);color:var(--pen)}
  .nav-nomor.terisi{background:var(--ink);border-color:var(--ink);color:#fff}
  .nav-nomor.terisi:hover{border-color:var(--pen);color:#fff}
  .nav-nomor.aktif{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-wash)}
  .nav-nomor:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

  /* ---------- aksi mode ujian ---------- */
  .aksi-ujian{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
  .aksi-ujian .tumbuh{flex:1 1 auto}
  .aksi-ujian .kanan{margin-left:auto}

  /* ---------- daftar review hasil ujian ---------- */
  .review{border-top:1px solid var(--rule);margin-top:26px;padding-top:20px;
    display:flex;flex-direction:column;gap:14px}
  .review-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);margin:0
  }
  .review-item{border:1px solid var(--rule);border-radius:6px;padding:15px 17px;background:#FBFCFD}
  .review-item.tepat{border-color:#C6E3D4;background:var(--benar-wash)}
  .review-item.meleset{border-color:#F1CFCB;background:var(--salah-wash)}
  .review-atas{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .review-no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--margin)}
  .review-kat{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint)
  }
  .review-soal{font-size:16px;line-height:1.45;font-weight:500;margin:0 0 10px;white-space:pre-line}
  .review-gambar{
    display:block;width:100%;max-width:100%;height:auto;
    border-radius:4px;border:1px solid var(--rule);margin:0 0 12px
  }
  .review-jawab{font-family:var(--mono);font-size:12.5px;line-height:1.75;margin:0}
  .review-jawab .ok{color:var(--benar);font-weight:600}
  .review-jawab .no{color:var(--salah);font-weight:600}
  .review-jawab .abu{color:var(--ink-soft)}
  .review-penjelasan{margin:9px 0 0;font-size:14.5px;color:#33475C}

  @media (max-width:560px){
    body{padding:20px 12px 48px}
    .lembar::before{display:none}
    .isi{padding:20px 18px}
    .kabar{padding:18px}
    .nomor{position:static;width:auto;text-align:left;margin-bottom:6px}
    .soal{font-size:17.5px}
    .judul{font-size:19px}
    .aksi{flex-direction:column-reverse;align-items:stretch}
    .tombol{width:100%}
    .petunjuk{text-align:center}
    .kop.lengket{margin:-20px -12px 18px;padding:14px 12px 10px}
    .hasil{padding:26px 18px}
    .navigator{padding:14px}
    .nav-grid{grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
    .nav-nomor{height:36px;font-size:12px}
    .aksi-ujian{flex-direction:column;align-items:stretch}
    .aksi-ujian .kanan{margin-left:0}
    .review-item{padding:13px 14px}
  }
  @media (max-width:380px){
    .nav-grid{grid-template-columns:repeat(auto-fill,minmax(32px,1fr))}
    .nav-nomor{height:33px;font-size:11.5px}
    .judul{font-size:17.5px}
    .soal{font-size:16.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="kop" id="kop">
    <div class="kop-kiri">
      <p class="eyebrow" id="eyebrowKop">Tes Potensi Akademik</p>
      <h1 class="judul" id="judulKop">Latihan Soal</h1>
    </div>
    <div class="skor-kop" id="kotakSkor">
      <div class="angka" id="skorAngka">0/0</div>
      <div class="ket">Benar</div>
    </div>
    <div class="waktu" id="kotakWaktu" hidden>
      <div class="angka" id="waktuAngka">00:00</div>
      <div class="ket">Sisa waktu</div>
    </div>
  </header>

  <div id="panelMenu"></div>

  <div id="panelSoal" hidden>
    <div class="progress-baris">
      <span class="posisi" id="posisi">Soal 1 dari 0</span>
      <span class="chip" id="chipKategori">—</span>
    </div>
    <div class="rel"><div class="rel-isi" id="relIsi"></div></div>

    <section class="lembar">
      <div class="isi">
        <div class="nomor" id="nomorSoal">01</div>
        <h2 class="soal" id="teksSoal"></h2>
        <img class="gambar-soal" id="gambarSoal" alt="" hidden>
        <ul class="opsi-list" id="daftarOpsi"></ul>
      </div>
      <div class="kabar" id="kabar" hidden>
        <div class="vonis" id="vonis"><span class="tanda"></span><span class="vonis-teks"></span></div>
        <p class="penjelasan" id="penjelasan"></p>
      </div>
    </section>

    <div class="aksi" id="aksiLatihan">
      <span class="petunjuk" id="petunjuk">Tekan A–F untuk menjawab</span>
      <button class="tombol" id="tombolLanjut" disabled>Lanjut</button>
    </div>

    <div class="aksi-ujian" id="aksiUjian" hidden>
      <button class="tombol hantu" id="tombolMundur">&larr; Sebelumnya</button>
      <button class="tombol hantu" id="tombolMaju">Berikutnya &rarr;</button>
      <button class="tombol kanan" id="tombolSelesai">Selesaikan sekarang</button>
    </div>

    <div class="navigator" id="navigator" hidden>
      <div class="nav-kepala">
        <span class="nav-label">Navigator soal</span>
        <span class="nav-hitung" id="navHitung">0 terjawab</span>
      </div>
      <div class="nav-grid" id="navGrid"></div>
    </div>
  </div>

  <div id="panelHasil" hidden></div>
</div>

<script>
// Bank Soal TPA — format siap pakai untuk aplikasi psikotes
// answer = indeks pilihan (0 = a, 1 = b, 2 = c, ...) atau null bila belum ada kunci
// image  = path gambar soal (opsional), relatif terhadap file HTML ini
// Total: 96 soal
//   GMA Verbal            55 (Analogi 41, Sinonim 7, Antonim 7)
//   GMA Numerical         24 (Numerik 24)
//   Smart Ability to Learn 17 (Penalaran Gambar 17)

const bankSoalTPA = [
  // ============ A. ANALOGI ============
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Buaya : Kadal",
    options: ["Kecil : Besar", "Zebra : Kuda", "Ayam : Kelinci", "Laki-Laki : Anak", "Roti : Rembulan"],
    answer: 1,
    explanation: "Buaya dan kadal adalah hewan sejenis (reptil) yang berbeda ukuran, sebagaimana zebra dan kuda sama-sama satu keluarga dengan bentuk mirip."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Kering : Air",
    options: ["Manusia : Norma", "Lapar : Kosong", "Hidung : Bau", "Ngantuk : Tidur", "Kuping : Tulang"],
    answer: 3,
    explanation: "Kering terjadi karena ketiadaan air, sebagaimana ngantuk terjadi karena kurangnya tidur."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Siswa : Belajar",
    options: ["Ilmuwan : Meneliti", "Santri : Garam", "Guru : Murid", "Karyawan : Mesin", "Nenek : Kakek"],
    answer: 0,
    explanation: "Hubungan pelaku dan aktivitas utamanya: siswa belajar, ilmuwan meneliti."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Air : Menguap",
    options: ["Es : Mencair", "Panas : Memuai", "Jatuh : Pecah", "Uap : Hujan", "Laut : Mendung"],
    answer: 0,
    explanation: "Air menguap adalah perubahan wujud zat, sebagaimana es mencair juga perubahan wujud zat."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Apoteker : Obat",
    options: ["Pesawat : Penyakit", "Koki : Masakan", "Montir : Rusak", "Meteor : Pohon", "Psikiater : Ide"],
    answer: 1,
    explanation: "Apoteker meracik obat, sebagaimana koki meracik masakan."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Pilot pada pesawat seperti supir pada...?",
    options: ["Terbang", "Setir", "Kemudi", "Mobil", "Masinis", "Penumpang"],

    explanation: "Pilot mengemudikan pesawat sebagaimana supir mengemudikan mobil."

  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Khianat pada percaya seperti permanen pada...?",
    options: ["Kekal", "Tetap", "Mapan", "Langgeng", "Fana", "Terpana"],
    answer: 4,
    explanation: "Hubungannya adalah lawan kata. Khianat lawan dari percaya, permanen lawan dari fana (sementara)."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Mana dari hal-hal berikut ini yang tidak memiliki kesamaan?",
    options: ["Serigala", "Kucing hutan", "Kijang", "Badak", "Buaya", "Jerapah"],
    answer: 4,
    explanation: "Buaya satu-satunya reptil, sedangkan serigala, kucing hutan, kijang, badak, dan jerapah semuanya mamalia."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Mana diantara hal-hal berikut ini yang tidak memiliki kesamaan?",
    options: ["Kemeja", "Kaos", "Celana", "Rok", "Cincin", "Gaun"],
    answer: 4,
    explanation: "Cincin adalah perhiasan, sedangkan pilihan lainnya adalah pakaian."
  },
  {
    section: "GMA Verbal",
    category: "Analogi",
    question: "Mana dari hal-hal berikut ini yang tidak memiliki kesamaan?",

    el.aksiUjian.hidden = true;
    el.navigator.hidden = true;
    el.kop.classList.remove("lengket");
    el.kotakWaktu.hidden = true;
    el.kotakSkor.hidden = false;
    el.skor.textContent = "0/0";
    el.eyebrowKop.textContent = "Mode latihan";
    el.judulKop.textContent = "Latihan Soal";

    render();
  }

  function mulaiUjian(paket) {
    hentikanTimer();
    mode = "ujian";
    paketAktif = paket;
    habisWaktu = false;
    terpakai = 0;

    var kolam = bankSoalTPA.filter(function (s) { return s.section === paket.section; });
    var diacak = acakSalinan(kolam);
    soal = diacak.slice(0, Math.min(paket.jumlah, diacak.length));
    siapkanPanelSoal();

    el.aksiLatihan.hidden = true;
    el.aksiUjian.hidden = false;
    el.navigator.hidden = false;
    el.kop.classList.add("lengket");
    el.kotakSkor.hidden = true;
    el.kotakWaktu.hidden = false;
    el.kotakWaktu.classList.remove("kritis");
    el.eyebrowKop.textContent = "Mode ujian";
    el.judulKop.textContent = paket.section;

    sisaDetik = paket.detik;
    bangunNavigator();
    render();
    mulaiTimer();
  }

  /* ---------- timer ---------- */

  function perbaruiWaktu() {
    el.waktuAngka.textContent = formatWaktu(sisaDetik);
    if (sisaDetik < 60) el.kotakWaktu.classList.add("kritis");
    else el.kotakWaktu.classList.remove("kritis");
  }

  function hentikanTimer() {
    if (timerId !== null) {
      window.clearInterval(timerId);
      timerId = null;
    }
  }

  function mulaiTimer() {
    hentikanTimer();
    perbaruiWaktu();
    timerId = window.setInterval(function () {
      sisaDetik--;
      if (sisaDetik <= 0) {
        sisaDetik = 0;
        perbaruiWaktu();
        hentikanTimer();
        selesaikanUjian(true);
        return;
      }
      perbaruiWaktu();
    }, 1000);
  }

  /* ---------- navigator ---------- */

  function bangunNavigator() {
    el.navGrid.innerHTML = "";
    soal.forEach(function (s, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "nav-nomor";
      b.textContent = pad(i + 1);
      b.setAttribute("aria-label", "Ke soal " + (i + 1));
      b.addEventListener("click", function () { keSoal(i); });
      el.navGrid.appendChild(b);
    });
  }

  function perbaruiNavigator() {
    var tombol = el.navGrid.children;
    var terisi = 0;
    for (var i = 0; i < tombol.length; i++) {
      var ada = pilihan[i] !== null;
      if (ada) terisi++;
      tombol[i].classList.toggle("terisi", ada);
      tombol[i].classList.toggle("aktif", i === indeks);
      if (i === indeks) tombol[i].setAttribute("aria-current", "true");
      else tombol[i].removeAttribute("aria-current");
    }
    el.navHitung.textContent = terisi + " dari " + soal.length + " terjawab";
  }

  /* ---------- render soal ---------- */

  function render() {
    var s = soal[indeks];
    terjawab = false;

    el.posisi.textContent = "Soal " + (indeks + 1) + " dari " + soal.length;
    el.chip.textContent = s.category;
    el.nomor.textContent = pad(indeks + 1);
    el.teks.textContent = s.question;
    el.rel.style.width = (indeks / soal.length) * 100 + "%";
    el.kabar.hidden = true;

    if (s.image) {
      el.gambar.src = s.image;
      el.gambar.alt = altGambar(s, indeks + 1);
      el.gambar.hidden = false;
    } else {
      kosongkanGambar();
    }

    el.opsi.innerHTML = "";
    s.options.forEach(function (teks, i) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opsi";
      btn.innerHTML = '<span class="bulat"></span><span class="teks-opsi"></span>';
      btn.querySelector(".bulat").textContent = HURUF[i];
      btn.querySelector(".teks-opsi").textContent = teks;
      btn.addEventListener("click", function () { jawab(i); });
      li.appendChild(btn);
      el.opsi.appendChild(li);
    });

    if (mode === "ujian") {
      if (pilihan[indeks] !== null) tandaiPilihan(pilihan[indeks]);
      el.mundur.disabled = indeks === 0;
      el.maju.disabled = indeks === soal.length - 1;
      perbaruiNavigator();
    } else {
      el.lanjut.disabled = true;
      el.lanjut.textContent = indeks === soal.length - 1 ? "Lihat hasil" : "Lanjut";
      el.petunjuk.textContent = "Tekan A\u2013" + HURUF[s.options.length - 1] + " untuk menjawab";
    }

    keAtas();
  }

  function tandaiPilihan(i) {
    var tombol = el.opsi.querySelectorAll(".opsi");
    for (var n = 0; n < tombol.length; n++) {
      tombol[n].classList.toggle("dipilih", n === i);
    }
  }

  /* ---------- menjawab ---------- */

  function jawab(i) {
    if (mode === "ujian") {
      pilihan[indeks] = i;
      tandaiPilihan(i);
      perbaruiNavigator();
      return;
    }

    if (terjawab) return;
    terjawab = true;

    var s = soal[indeks];
    var kunci = s.answer;
    var tombol = el.opsi.querySelectorAll(".opsi");
    var tepat = kunci !== null && i === kunci;
    pilihan[indeks] = i;

    for (var n = 0; n < tombol.length; n++) {
      tombol[n].disabled = true;
      if (kunci !== null && n === kunci) {
        tombol[n].classList.add("benar");
      } else if (n === i) {
        tombol[n].classList.add(kunci === null ? "dipilih" : "salah");
      }
    }

    dijawab++;
    if (!rekap[s.category]) rekap[s.category] = { benar: 0, total: 0 };
    rekap[s.category].total++;
    if (tepat) { benar++; rekap[s.category].benar++; }
    el.skor.textContent = benar + "/" + dijawab;

    var kelas, label, tanda;
    if (kunci === null) {
      kelas = "abu"; label = "Belum ada kunci"; tanda = "?";
    } else if (tepat) {
      kelas = "ok"; label = "Benar"; tanda = "\u2713";
    } else {
      kelas = "no"; label = "Salah \u00b7 kunci " + HURUF[kunci]; tanda = "\u2715";
    }
    el.vonis.className = "vonis " + kelas;
    el.vonis.querySelector(".tanda").textContent = tanda;
    el.vonis.querySelector(".vonis-teks").textContent = label;
    el.penjelasan.textContent = s.explanation;

    el.kabar.hidden = false;
    el.lanjut.disabled = false;
    el.petunjuk.textContent = "Tekan Enter untuk lanjut";
    el.lanjut.focus();
  }

  function lanjut() {
    if (mode !== "latihan" || !terjawab) return;
    if (indeks === soal.length - 1) tampilkanHasilLatihan();
    else { indeks++; render(); }
  }

  function keSoal(i) {
    if (mode !== "ujian" || i < 0 || i >= soal.length || i === indeks) return;
    indeks = i;
    render();
  }

  function pindah(langkah) {
    keSoal(indeks + langkah);
  }

  /* ---------- selesai & hasil ---------- */

  function jumlahKosong() {
    var kosong = 0;
    for (var i = 0; i < pilihan.length; i++) if (pilihan[i] === null) kosong++;
    return kosong;
  }

  function mintaSelesai() {
    var kosong = jumlahKosong();
    if (kosong > 0) {
      var pesan = "Masih ada " + kosong + " soal yang belum dijawab dan akan dihitung salah.\n\n" +
        "Selesaikan ujian sekarang?";
      if (!window.confirm(pesan)) return;
    }
    selesaikanUjian(false);
  }

  function selesaikanUjian(karenaWaktuHabis) {
    hentikanTimer();
    habisWaktu = !!karenaWaktuHabis;
    terpakai = paketAktif.detik - sisaDetik;

    benar = 0; dijawab = 0; rekap = {};
    soal.forEach(function (s, i) {
      if (!rekap[s.category]) rekap[s.category] = { benar: 0, total: 0 };
      rekap[s.category].total++;
      if (pilihan[i] !== null) {
        dijawab++;
        if (s.answer !== null && pilihan[i] === s.answer) {
          benar++;
          rekap[s.category].benar++;
        }
      }
    });

    tampilkanHasilUjian();
  }

  function htmlReview() {
    var html = '<div class="review"><p class="review-label">Pembahasan seluruh soal</p>';

    soal.forEach(function (s, i) {
      var jawabMu = pilihan[i];
      var kunci = s.answer;
      var tepat = kunci !== null && jawabMu !== null && jawabMu === kunci;
      var kelas = jawabMu === null ? "" : (tepat ? " tepat" : " meleset");

      html +=
        '<div class="review-item' + kelas + '">' +
        '<div class="review-atas"><span class="review-no">' + pad(i + 1) + "</span>" +
        '<span class="review-kat">' + esc(s.category) + "</span></div>" +
        '<p class="review-soal">' + esc(s.question) + "</p>";

      if (s.image) {
        html += '<img class="review-gambar" src="' + esc(s.image) +
          '" alt="' + esc(altGambar(s, i + 1)) + '">';
      }

      var kelasJawab = jawabMu === null ? "abu" : (tepat ? "ok" : "no");
      var teksJawab = jawabMu === null ? "Tidak dijawab" : labelOpsi(s, jawabMu);
      html +=
        '<p class="review-jawab">Jawabanmu: <span class="' + kelasJawab + '">' +
        esc(teksJawab) + "</span><br>Kunci: " +
        (kunci === null
          ? '<span class="abu">Belum ada kunci</span>'
          : '<span class="ok">' + esc(labelOpsi(s, kunci)) + "</span>") +
        "</p>" +
        '<p class="review-penjelasan">' + esc(s.explanation) + "</p>" +
        "</div>";
    });

    return html + "</div>";
  }

  function tampilkanHasilUjian() {
    var persen = soal.length ? Math.round((benar / soal.length) * 100) : 0;
    var kosong = jumlahKosong();

    var html =
      '<div class="hasil">' +
      '<p class="eyebrow">Hasil ujian \u00b7 ' + esc(paketAktif.section) + "</p>" +
      '<div class="hasil-angka">' + benar +
      '<span style="color:var(--ink-faint)">/' + soal.length + "</span></div>" +
      '<p class="hasil-sub">' + persen + "% benar. " + catatan(persen) + "</p>" +
      '<dl class="hasil-fakta">' +
      '<div class="fakta"><dt>Status</dt><dd' + (habisWaktu ? ' class="tegas"' : "") + ">" +
      (habisWaktu
        ? "Waktu habis \u00b7 ujian ditutup otomatis"
        : "Diselesaikan sendiri sebelum waktu habis") +
      "</dd></div>" +
      '<div class="fakta"><dt>Waktu terpakai</dt><dd>' + formatWaktu(terpakai) +
      " dari " + formatWaktu(paketAktif.detik) + "</dd></div>" +
      '<div class="fakta"><dt>Soal tidak dijawab</dt><dd' +
      (kosong > 0 ? ' class="tegas"' : "") + ">" + kosong + " dari " + soal.length +
      " soal</dd></div>" +
      "</dl>" +
      htmlRincian(rekap) +
      htmlReview() +
      '<div class="hasil-aksi">' +
      '<button class="tombol" type="button" id="ulangiPaket">Ulangi paket ini</button>' +
      '<button class="tombol hantu" type="button" id="keMenu">Kembali ke menu</button>' +
      "</div></div>";

    var paket = paketAktif;
    el.panelHasil.innerHTML = html;
    el.panelSoal.hidden = true;
    el.panelHasil.hidden = false;
    el.kop.classList.remove("lengket");
    el.kotakWaktu.hidden = true;
    el.kotakSkor.hidden = false;
    el.skor.textContent = benar + "/" + soal.length;
    el.eyebrowKop.textContent = "Hasil ujian";
    mode = "hasil";

    document.getElementById("ulangiPaket").addEventListener("click", function () {
      mulaiUjian(paket);
    });
    document.getElementById("keMenu").addEventListener("click", tampilkanMenu);
    keAtas();
  }

  function tampilkanHasilLatihan() {
    var persen = Math.round((benar / soal.length) * 100);
    var html =
      '<div class="hasil">' +
      '<p class="eyebrow">Hasil latihan</p>' +
      '<div class="hasil-angka">' + benar +
      '<span style="color:var(--ink-faint)">/' + soal.length + "</span></div>" +
      '<p class="hasil-sub">' + persen + "% benar. " + catatan(persen) + "</p>" +
      htmlRincian(rekap) +
      '<div class="hasil-aksi">' +
      '<button class="tombol" type="button" id="ulangi">Ulangi dari awal</button>' +
      '<button class="tombol hantu" type="button" id="keMenuLatihan">Kembali ke menu</button>' +
      "</div></div>";

    el.panelHasil.innerHTML = html;
    el.panelSoal.hidden = true;
    el.panelHasil.hidden = false;
    el.skor.textContent = benar + "/" + soal.length;
    mode = "hasil";

    document.getElementById("ulangi").addEventListener("click", mulaiLatihan);
    document.getElementById("keMenuLatihan").addEventListener("click", tampilkanMenu);
    keAtas();
  }

  /* ---------- interaksi ---------- */

  el.lanjut.addEventListener("click", lanjut);
  el.mundur.addEventListener("click", function () { pindah(-1); });
  el.maju.addEventListener("click", function () { pindah(1); });
  el.selesai.addEventListener("click", mintaSelesai);

  document.addEventListener("keydown", function (e) {
    if (el.panelSoal.hidden) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    var diTombol = e.target && e.target.tagName === "BUTTON";
    if (diTombol && (e.key === "Enter" || e.key === " ")) return;

    if (mode === "ujian") {
      if (e.key === "ArrowLeft") { e.preventDefault(); pindah(-1); return; }
      if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); pindah(1); return; }
    } else if (mode === "latihan") {
      if (e.key === "Enter" && terjawab) { e.preventDefault(); lanjut(); return; }
      if (terjawab) return;
    } else {
      return;
    }

    var k = e.key.length === 1 ? e.key.toUpperCase() : "";
    var i = k ? HURUF.indexOf(k) : -1;
    if (i === -1 && k) i = "123456".indexOf(k);
    if (i > -1 && i < soal[indeks].options.length) { e.preventDefault(); jawab(i); }
  });

  window.addEventListener("beforeunload", hentikanTimer);

  tampilkanMenu();
})();
</script>
</body>
</html>
